name: Deploy demo to Pages

on:
  push:
    branches: [main]
    # Only rebuild when something the demo actually renders has changed.
    paths:
      - 'data/**'
      - 'tools/demo-mock.js'
      - 'tools/make-demo.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the shipped UI parses before publishing it
        run: node --check data/app.js

      - name: Assemble the demo
        run: bash tools/make-demo.sh build/demo

      # enablement:true turns Pages on if it is not already, so a fork gets a
      # working demo without anyone having to visit the settings page first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
