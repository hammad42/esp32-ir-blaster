name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build every target
        run: |
          mkdir -p dist
          for env in esp32dev esp32dev_oled esp32s3 esp32c3; do
            pio run -e "$env"
            pio run -e "$env" -t buildfs
            cp ".pio/build/$env/firmware.bin"   "dist/${env}-firmware.bin"
            cp ".pio/build/$env/littlefs.bin"   "dist/${env}-littlefs.bin"
            cp ".pio/build/$env/bootloader.bin" "dist/${env}-bootloader.bin"
            cp ".pio/build/$env/partitions.bin" "dist/${env}-partitions.bin"
          done

      # Anyone can then verify a download matches what CI produced.
      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Flashing a prebuilt image

            Both images are required — the firmware alone serves only a
            recovery page, because the web UI lives in the filesystem image.

            ```bash
            esptool.py --chip esp32 --port /dev/ttyUSB0 --baud 921600 \
              write_flash \
                0x1000   esp32dev-bootloader.bin \
                0x8000   esp32dev-partitions.bin \
                0x10000  esp32dev-firmware.bin \
                0x310000 esp32dev-littlefs.bin
            ```

            Offsets are from `partitions_ir_4mb.csv`; the ESP32-S3 build uses
            the 8 MB table, so its filesystem offset is `0x610000` and its
            bootloader goes to `0x0`.

            Already running this firmware? Update over the air instead:
            **System → Firmware update** in the web UI. A filesystem update
            erases learned commands, so export a backup first.

            Verify a download against `SHA256SUMS.txt`.
