; ============================================================================
;  ESP32 Universal IR Blaster & Receiver
;  ---------------------------------------------------------------------------
;  Build:      pio run -e esp32dev
;  Flash FW:   pio run -e esp32dev -t upload
;  Flash WEB:  pio run -e esp32dev -t uploadfs      <-- REQUIRED (web UI lives
;                                                       in the LittleFS image)
;  Monitor:    pio device monitor
;
;  Platform is pinned on purpose. arduino-esp32 2.0.17 (platform 6.13.0) is the
;  most field-proven combination for IRremoteESP8266 + the core WebServer and
;  is what this firmware is validated against. Do not float these versions on a
;  device that has to run unattended for years.
; ============================================================================

[platformio]
default_envs = esp32dev
data_dir     = data

; ---------------------------------------------------------------------------
[common]
platform  = espressif32@6.13.0
framework = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs

; Pinned exactly, for the same reason the platform is: a device that runs
; unattended for years should rebuild bit-identically next year. See
; CONTRIBUTING.md for how to bump these and what to re-verify afterwards.
lib_deps =
    crankyoldgit/IRremoteESP8266@2.9.0
    bblanchon/ArduinoJson@7.4.3
    knolleary/PubSubClient@2.8.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"1.0.0\"
    ; PubSubClient's 256 byte default is far too small for Home Assistant
    ; discovery payloads. Raised at compile time *and* at runtime.
    -DMQTT_MAX_PACKET_SIZE=1024
    ; Max raw timing entries per command. 1024 covers every consumer A/C
    ; protocol the author is aware of (Daikin 2-frame is the worst case at
    ; ~600). Raising this costs 2 bytes of RAM per entry, three times over.
    -DIR_MAX_RAW=1024
    ; Comment out to save ~1 KB if you never want network-tool OTA
    -DENABLE_ARDUINO_OTA=1

; ---------------------------------------------------------------------------
; Classic ESP32 DevKit v1 / WROOM-32 - 4 MB flash. The reference target.
[env:esp32dev]
extends = common
board = esp32dev
board_build.partitions = partitions_ir_4mb.csv

; ---------------------------------------------------------------------------
; Same board, with the optional SSD1306 OLED compiled in.
[env:esp32dev_oled]
extends = env:esp32dev
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
build_flags =
    ${common.build_flags}
    -DENABLE_OLED=1

; ---------------------------------------------------------------------------
; ESP32-S3 DevKitC-1 - 8 MB flash variant.
[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = partitions_ir_8mb.csv
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini / DevKitM-1 - 4 MB flash.
[env:esp32c3]
extends = common
board = esp32-c3-devkitm-1
board_build.partitions = partitions_ir_4mb.csv
build_flags =
    ${common.build_flags}
    ; The C3 has no USB-OTG peripheral, only USB Serial/JTAG, so CDC-on-boot
    ; must be paired with USB_MODE=1 or `Serial` resolves to nothing and the
    ; build fails. The S3 board definition sets USB_MODE itself; the C3 one
    ; does not. Drop both flags if your board wires an external UART bridge.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; ---------------------------------------------------------------------------
; Over-the-air flashing once the device is on your WiFi.
;   pio run -e esp32dev_ota -t upload
;   pio run -e esp32dev_ota -t uploadfs
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port     = ir-blaster.local
; upload_flags  = --auth=your-ota-password
